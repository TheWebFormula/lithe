name: Mirror to Codeberg

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  codeberg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mirror to Codeberg
        uses: snyk/github-repository-mirroring-action@v1
        with:
          target_repository_url: "https://codeberg.org/TheWebFormula/lithe.git"
          target_username: "b-3po"
          target_password: ${{ secrets.CODEBERG_TOKEN }}
